<header class="site-header wrap">
  <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Bonitas Foundation home">
    {{ partial "cross.html" . }}
    <span class="brand-name">Bonitas<span class="brand-foundation">Foundation</span></span>
  </a>
  <nav aria-label="Main navigation">
    <ul class="main-nav">
      {{- $page := . -}}
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if $page.IsMenuCurrent .Menu . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>
